<script>location.replace('chat.html');// __FDS_OWNER_GMAIL_V2__
const FDS_SB_URL="https://hldkkxrlvprnufeoyzlf.supabase.co";const FDS_SB_KEY="sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ";const fdsSupabase=window.supabase.createClient(FDS_SB_URL,FDS_SB_KEY);const FDS_OWNER_EMAIL="123mudassirali546@gmail.com";let ownerConversationChannel=null;
function ownerSetStatus(t){const e=document.getElementById("ownerStatus");if(e)e.textContent=t}
async function ownerLogin(){const email=(document.getElementById("ownerEmail")?.value||"").trim().toLowerCase();if(email!==FDS_OWNER_EMAIL){ownerSetStatus("Owner Gmail incorrect. Use 123mudassirali546@gmail.com");return}const {error}=await fdsSupabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});ownerSetStatus(error?("Login error: "+error.message):"Gmail par login link bhej diya. Gmail khol kar link tap karo.")}
async function ownerCheck(){const {data:{user}}=await fdsSupabase.auth.getUser();if(!user)return;if((user.email||"").toLowerCase()!==FDS_OWNER_EMAIL){ownerSetStatus("Ye Gmail owner nahi hai.");return}const {data}=await fdsSupabase.from("owner_access").select("user_id").eq("user_id",user.id).maybeSingle();if(!data){ownerSetStatus("Owner access not found for this Gmail.");return}document.getElementById("ownerPanel").style.display="block";ownerSetStatus("Owner verified ✓ "+user.email);ownerLoadConversations()}
async function ownerLoadConversations(){const box=document.getElementById("ownerConversations");if(!box)return;box.innerHTML="<div class="empty">Loading chats…</div>";const {data,error}=await fdsSupabase.from("messages").select("sender_id,receiver_id,sender_email,receiver_email,sender_name,receiver_name,message,created_at").order("created_at",{ascending:false});if(error){box.innerHTML="<div class="empty">"+esc(error.message)+"</div>";return}const map=new Map();(data||[]).forEach(x=>{const k=[x.sender_id,x.receiver_id].sort().join("|");if(!map.has(k))map.set(k,x)});const rows=[...map.values()];if(!rows.length){box.innerHTML="<div class="empty">No messages yet.</div>";return}box.innerHTML=rows.map((x,i)=>{const a=x.sender_name||x.sender_email||x.sender_id,b=x.receiver_name||x.receiver_email||x.receiver_id;return `<button class="worker" data-i="${i}"><div><b>${esc(a)} ↔ ${esc(b)}</b><small>${esc(x.message||"")}</small></div><span class="pill">OPEN</span></button>`}).join("");box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const x=rows[+b.dataset.i];ownerOpenConversation(x.sender_id,x.receiver_id,(x.sender_name||x.sender_email||x.sender_id)+" ↔ "+(x.receiver_name||x.receiver_email||x.receiver_id))})}
async function ownerOpenConversation(a,b,title){document.getElementById("ownerConversation").style.display="block";document.getElementById("ownerConversationTitle").textContent=title;const box=document.getElementById("ownerMessages");const {data,error}=await fdsSupabase.from("messages").select("*").or(`and(sender_id.eq.${a},receiver_id.eq.${b}),and(sender_id.eq.${b},receiver_id.eq.${a})`).order("created_at",{ascending:true});if(error){box.innerHTML="<div class="empty">"+esc(error.message)+"</div>";return}ownerRenderMessages(data||[],false);if(ownerConversationChannel)await fdsSupabase.removeChannel(ownerConversationChannel);ownerConversationChannel=fdsSupabase.channel("owner-live-"+[a,b].sort().join("-")).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{const x=p.new;if((x.sender_id===a&&x.receiver_id===b)||(x.sender_id===b&&x.receiver_id===a))ownerRenderMessages([x],true)}).subscribe()}
function ownerRenderMessages(rows,append){const box=document.getElementById("ownerMessages");if(!append)box.innerHTML="";rows.forEach(x=>{const d=document.createElement("div");d.className="worker";d.style.display="block";d.style.marginBottom="7px";d.innerHTML="<b>"+esc(x.sender_name||x.sender_email||x.sender_id)+"</b><div style="margin-top:5px">"+esc(x.message)+"</div><small>"+new Date(x.created_at).toLocaleString()+"</small>";box.appendChild(d)});box.scrollTop=box.scrollHeight}
document.getElementById("ownerLoginBtn")?.addEventListener("click",ownerLogin);document.getElementById("ownerRefresh")?.addEventListener("click",ownerLoadConversations);fdsSupabase.auth.onAuthStateChange(()=>setTimeout(ownerCheck,0));ownerCheck();

</script>
