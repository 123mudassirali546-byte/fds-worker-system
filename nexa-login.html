l=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return set('Email aur minimum 6-character password required.');$('go').disabled=true;$('go').textContent='Please wait…';try{const r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error)return set(r.error.message);if(signup&&!r.data.session)return set('Account ban gaya. Email verification required ho to verify karke Login karo.');if(r.data.session){set('Login successful ✓ Opening NEXA…');setTimeout(()=>location.replace('chat.html'),250)}else set('Login failed: no session created.')}catch(e){set('Login error: '+(e?.message||String(e)))}finally{$('go').disabled=false;$('go').textContent=signup?'Create NEXA Account':'Login'}}$('toggle').onclick=toggle;$('go').onclick=go;db.auth.getSession().then(r=>{if(r.data.session)location.replace('chat.html')});</script></body></html>
