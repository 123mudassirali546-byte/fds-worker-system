<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FDS Owner Room</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#080808;color:#fff;margin:0}.app{max-width:800px;margin:auto;padding:18px}.box{background:#151515;border:1px solid #3b2d12;border-radius:18px;padding:15px;margin-bottom:12px}button{padding:11px;border:0;border-radius:10px;background:#f0b52b}input{padding:11px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;width:70%}.chat{height:55vh;overflow:auto}.conv{padding:12px;border:1px solid #333;border-radius:12px;margin:7px 0;cursor:pointer}.msg{padding:9px;margin:6px;border-radius:12px;background:#222}.me{background:#392b0d;text-align:right}</style></head><body><div class="app"><h2>👑 FDS Owner Room</h2><div class="box"><input id="email" placeholder="Owner Gmail"><button onclick="login()">Login</button><div id="status"></div></div><div id="panel" class="box" style="display:none"><b>All Conversations</b><div id="convs"></div></div><div id="chatbox" class="box" style="display:none"><b id="title"></b><div id="chat" class="chat"></div></div></div><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ');let me=null,sub=null;async function login(){let email=document.getElementById('email').value.trim().toLowerCase();if(email!=='123mudassirali546@gmail.com')return status('Owner Gmail required.');let {data,error}=await db.auth.signInWithOtp({email});if(error)return status(error.message);status('Magic link Gmail par bhej diya. Gmail se link open karo.');}function status(x){document.getElementById('status').textContent=x}async function start(){let {data}=await db.auth.getUser();if(!data.user)return;let {data:o}=await db.from('owner_access').select('*').eq('user_id',data.user.id).maybeSingle();if(!o)return status('This account is not an authorized owner.');me=data.user;document.getElementById('panel').style.display='block';await conversations();}async function conversations(){let {data,error}=await db.from('messages').select('sender_id,receiver_id,sender_email,receiver_email,sender_name,receiver_name,created_at').order('created_at',{ascending:false});if(error)return status(error.message);let map={};(data||[]).forEach(x=>{let key=[x.sender_id,x.receiver_id].sort().join('|');if(!map[key])map[key]=x});document.getElementById('convs').innerHTML='';Object.values(map).forEach(x=>{let d=document.createElement('div');d.className='conv';d.textContent=(x.sender_name||x.sender_email||x.sender_id)+' ↔ '+(x.receiver_name||x.receiver_email||x.receiver_id);d.onclick=()=>openChat(x.sender_id,x.receiver_id,d.textContent);document.getElementById('convs').appendChild(d)});}async function openChat(a,b,title){document.getElementById('chatbox').style.display='block';document.getElementById('title').textContent=title;let {data,error}=await db.from('messages').select('*').or(`and(sender_id.eq.${a},receiver_id.eq.${b}),and(sender_id.eq.${b},receiver_id.eq.${a})`).order('created_at',{ascending:true});if(error)return status(error.message);render(data||[]);if(sub)await db.removeChannel(sub);sub=db.channel('owner-'+[a,b].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{let x=p.new;if((x.sender_id===a&&x.receiver_id===b)||(x.sender_id===b&&x.receiver_id===a))render([x],true)}).subscribe();}function render(arr,append=false){let c=document.getElementById('chat');if(!append)c.innerHTML='';arr.forEach(x=>{let d=document.createElement('div');d.className='msg';d.textContent=(x.sender_name||x.sender_email||x.sender_id)+': '+x.message;c.appendChild(d)});c.scrollTop=c.scrollHeight;}db.auth.onAuthStateChange(()=>start());start();</script></body></html>
