<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache"><title>NEXA Chatting</title></head><body style="margin:0;background:#03070b;color:#fff;font-family:system-ui;text-align:center;padding-top:20vh"><div id="status">Opening NEXA…</div><script>(async()=>{try{const r=await fetch('nexa-app.html?v=8',{cache:'no-store'});if(!r.ok)throw new Error('NEXA app could not be loaded');let html=await r.text();html=html.replace('</head>','<link rel="stylesheet" href="nexa-premium.css?v=8"></head>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='NEXA loading failed: '+e.message}})();</script></body></html>
