<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Chatting</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui}.app{max-width:650px;margin:auto;min-height:100vh;padding-bottom:78px}.top{padding:20px 15px;display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe28a,#a66e12);color:#111;font-weight:1000}.top small,.muted{color:#888}.card{margin:0 14px 14px;padding:18px;background:#111;border:1px solid #302611;border-radius:22px}.page{display:none}.page.active{display:block}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:900}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff;border:1px solid #333}.input{width:100%;box-sizing:border-box;padding:14px;border-radius:13px;border:1px solid #333;background:#090909;color:#fff}.row{display:flex;gap:8px}.row .input{flex:1}.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #292929;background:#0b0b0b;border-radius:14px;margin-top:8px}.item main{flex:1}.item small{display:block;color:#777}.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#ffe08a;color:#111;font-weight:1000;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.id{color:#ffe08a;font-weight:900}.chat{margin:0 14px;height:67vh;min-height:430px;border:1px solid #3a2b10;border-radius:22px;overflow:hidden;background:#080808;display:flex;flex-direction:column}.head{padding:12px;border-bottom:1px solid #29220f;display:flex;gap:10px;align-items:center}.head main{flex:1}.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px}.empty{margin:auto;text-align:center;color:#666}.bubble{max-width:82%;padding:10px 12px;border-radius:17px;background:#171717;border:1px solid #292929;word-break:break-word}.mine{align-self:flex-end;background:#30250f;border-color:#594317}.bubble small{display:block;text-align:right;color:#777;font-size:9px}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid #29220f}.composer .input{flex:1}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(650px,100%);box-sizing:border-box;padding:7px;background:#0d0d0def;backdrop-filter:blur(15px);border-top:1px solid #29220f;display:flex;justify-content:space-around;z-index:5}.nav{background:none;border:0;color:#777;font-size:10px;font-weight:800;padding:7px}.nav.active{color:#ffe08a}.notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(520px,90%);z-index:50;background:#17120a;border:1px solid #ffe08a;color:#fff;padding:12px 15px;border-radius:16px;box-shadow:0 8px 30px #000;display:none}.searchRow{display:flex;gap:8px}.searchRow .input{flex:1}.add{background:#ffe08a;color:#111;border:0;border-radius:10px;padding:9px 12px;font-weight:900}.tag{font-size:11px;color:#ffe08a}.auth{max-width:430px;margin:10vh auto;background:#111;border:1px solid #34280f;border-radius:24px;padding:24px}.auth h1{color:#ffe08a;text-align:center}.auth .input{margin:7px 0}.auth .btn{width:100%;margin-top:9px}</style></head><body><div id="notice" class="notice"></div><div id="root"></div><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let profile=null,peer=null,chan=null;function notice(t,b){$('notice').innerHTML='<b>'+esc(t)+'</b><br>'+esc(b);$('notice').style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>$('notice').style.display='none',2500)}function avatar(p){return p?.avatar_url?'<div class="avatar"><img src="'+esc(p.avatar_url)+'"></div>':'<div class="avatar">'+esc((p?.display_name||'U')[0].toUpperCase())+'</div>'}function nav(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='users')loadContacts();if(p==='chats')loadChats();if(p==='owner'&&profile?.role==='owner')loadOwner()}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('status').textContent='Email aur password enter karo.';$('loginBtn').disabled=true;$('status').textContent='Signing in…';const r=await db.auth.signInWithPassword({email,password});if(r.error){$('status').textContent=r.error.message;$('loginBtn').disabled=false;return}await boot(r.data.user)}function render(){const owner=profile.role==='owner';$('root').innerHTML='<div class="app"><header class="top"><div class="logo">N</div><div><b>NEXA Chatting</b><small>Private • Fast • Real-Time</small></div></header><main id="chats" class="page active"><section class="card"><h2>Chats</h2><div id="chatList" class="empty">No chats yet.</div></section></main><main id="users" class="page"><section class="card"><h2>Users</h2><div class="searchRow"><input id="search" class="input" maxlength="6" inputmode="numeric" placeholder="Enter 6-digit NEXA ID"><button id="find" class="btn gold">Search</button></div><div id="result"></div><h3>My Contacts</h3><div id="contacts" class="empty">Loading…</div></section></main><main id="chat" class="page"><section class="chat"><div class="head"><button id="back" class="btn dark">←</button><main><b id="chatName">Chat</b><small id="chatId"></small></main></div><div id="msgs" class="msgs"></div><div class="composer"><input id="text" class="input" placeholder="Message…" maxlength="1000"><button id="send" class="btn gold">➤</button></div></section></main><main id="profile" class="page"><section class="card"><h2>'+(owner?'OWNER':'Profile')+'</h2><p class="muted">Name: <b>'+(owner?'Mudassir Ali':esc(profile.display_name||'User'))+'</b></p><p class="muted">NEXA ID: <span class="id">'+esc(owner?'OWNER':profile.chat_id)+'</span></p><p class="muted">'+esc(profile.email||'')+'</p><button id="logout" class="btn dark" style="width:100%">Logout</button></section></main><main id="settings" class="page"><section class="card"><h2>Settings</h2><p>Messaging: <b>Realtime</b></p><p>Notifications: <span id="notifState">Checking…</span></p><button id="notifyBtn" class="btn gold">🔔 Enable Notifications</button></section></main><main id="about" class="page"><section class="card"><h2>About NEXA</h2><p><b>Created by Mudassir Ali</b></p><p class="id">Full Stack Developer</p><p class="muted">Founder & Creator of NEXA Chatting System.</p></section></main>'+(owner?'<main id="owner" class="page"><section class="card"><h2>👑 OWNER CHAT MONITOR</h2><div id="ownerList" class="empty">Loading…</div></section></main>':'')+'</div><nav class="bottom"><button class="nav active" data-p="chats">💬<br>Chats</button><button class="nav" data-p="users">👥<br>Users</button><button class="nav" data-p="profile">◉<br>Profile</button><button class="nav" data-p="settings">⚙<br>Settings</button><button class="nav" data-p="about">ℹ️<br>About</button>'+(owner?'<button class="nav" data-p="owner">👑<br>Owner</button>':'')+'</nav>';document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>nav(x.dataset.p));$('find').onclick=findUser;$('search').onkeydown=e=>{if(e.key==='Enter')findUser()};$('send').onclick=send;$('text').onkeydown=e=>{if(e.key==='Enter')send()};$('back').onclick=()=>nav('chats');$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('notifyBtn').onclick=enableNotifications;syncNotificationButton();loadChats();loadContacts();if(owner)loadOwner()}async function boot(u){const r=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(r.error||!r.data){location.replace('nexa-direct-login.html');return}profile=r.data;render();watch()}async function findUser(){const id=$('search').value.trim();if(!/^\d{6}$/.test(id))return $('result').innerHTML='<p class="muted">6 digit NEXA ID likho.</p>';const r=await db.from('profiles').select('id,display_name,chat_id,email,avatar_url,role').eq('chat_id',id).maybeSingle();if(r.error)return $('result').innerHTML='<p class="muted">Search error: '+esc(r.error.message)+'</p>';if(!r.data)return $('result').innerHTML='<p class="muted">User not found.</p>';if(r.data.id===profile.id)return $('result').innerHTML='<p class="muted">Ye aapka apna ID hai.</p>';const p=r.data,n=p.role==='owner'?'OWNER':(p.display_name||'User');const existing=await db.from('contacts').select('id').eq('user_id',profile.id).eq('contact_id',p.id).maybeSingle();$('result').innerHTML='<div class="item">'+avatar(p)+'<main><b>'+esc(n)+'</b><small>NEXA ID '+esc(p.chat_id)+'</small></main><button id="addBtn" class="add">'+(existing.data?'✓ Added':'＋ Add')+'</button></div>';if(!existing.data)$('addBtn').onclick=()=>addContact(p);else $('addBtn').disabled=true}async function addContact(p){const r=await db.from('contacts').upsert({user_id:profile.id,contact_id:p.id},{onConflict:'user_id,contact_id'});if(r.error){notice('Add failed',r.error.message);return}$('addBtn').textContent='✓ Added';$('addBtn').disabled=true;await loadContacts();notice('Contact added',p.display_name||'User')}async function loadContacts(){if(!profile||!$('contacts'))return;const c=await db.from('contacts').select('contact_id').eq('user_id',profile.id).order('created_at',{ascending:false});if(c.error){$('contacts').innerHTML='<div class="muted">'+esc(c.error.message)+'</div>';return}if(!c.data?.length){$('contacts').innerHTML='<div class="empty">No contacts yet.</div>';return}const ids=c.data.map(x=>x.contact_id),p=await db.from('profiles').select('id,display_name,chat_id,email,avatar_url,role').in('id',ids);if(p.error){$('contacts').innerHTML='<div class="muted">'+esc(p.error.message)+'</div>';return}const map=new Map(p.data.map(x=>[x.id,x]));$('contacts').innerHTML=ids.map(id=>{const x=map.get(id);if(!x)return '';const n=x.role==='owner'?'OWNER':(x.display_name||'User');return '<div class="item" data-contact="'+x.id+'">'+avatar(x)+'<main><b>'+esc(n)+'</b><small>NEXA ID '+esc(x.chat_id)+'</small></main><span class="tag">CHAT</span></div>'}).join('');document.querySelectorAll('[data-contact]').forEach(e=>e.onclick=async()=>{const x=map.get(e.dataset.contact);if(x)openChat(x)})}async function loadChats(){if(!profile)return;const r=await db.from('messages').select('sender_auth_id,receiver_auth_id,sender_name,receiver_name,message,created_at').or('sender_auth_id.eq.'+profile.id+',receiver_auth_id.eq.'+profile.id).order('created_at',{ascending:false});if(r.error)return $('chatList').textContent=r.error.message;const m=new Map();(r.data||[]).forEach(x=>{const id=x.sender_auth_id===profile.id?x.receiver_auth_id:x.sender_auth_id;if(!m.has(id))m.set(id,x)});if(!m.size)return $('chatList').innerHTML='<div class="empty">No chats yet. Users me ja kar ID search karo.</div>';const ids=[...m.keys()],p=await db.from('profiles').select('id,display_name,chat_id,email,avatar_url,role').in('id',ids),map=new Map((p.data||[]).map(x=>[x.id,x]));$('chatList').innerHTML=[...m.entries()].map(([id,x])=>{const q=map.get(id),n=q?.role==='owner'?'OWNER':(q?.display_name||x.sender_name||'User');return '<div class="item" data-chat="'+id+'">'+avatar(q)+'<main><b>'+esc(n)+'</b><small>'+esc(x.message||'')+'</small></main></div>'}).join('');document.querySelectorAll('[data-chat]').forEach(e=>e.onclick=async()=>{const q=await db.from('profiles').select('id,display_name,chat_id,email,avatar_url,role').eq('id',e.dataset.chat).maybeSingle();if(q.data)openChat(q.data)})}async function openChat(p){peer=p;nav('chat');$('chatName').textContent=p.role==='owner'?'OWNER':(p.display_name||'User');$('chatId').textContent='NEXA ID '+p.chat_id;await loadMsgs();if(chan)await db.removeChannel(chan);chan=db.channel('chat-'+[profile.id,p.id].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},x=>{const m=x.new;if((m.sender_auth_id===profile.id&&m.receiver_auth_id===p.id)||(m.sender_auth_id===p.id&&m.receiver_auth_id===profile.id)){loadMsgs();if(m.receiver_auth_id===profile.id)notice('New message from '+(m.sender_name||'User'),m.message||'New message')}}).subscribe()}async function loadMsgs(){if(!peer)return;const r=await db.from('messages').select('*').or('and(sender_auth_id.eq.'+profile.id+',receiver_auth_id.eq.'+peer.id+'),and(sender_auth_id.eq.'+peer.id+',receiver_auth_id.eq.'+profile.id+')').order('created_at',{ascending:true});if(r.error){$('msgs').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}$('msgs').innerHTML=(r.data||[]).map(m=>'<div class="bubble '+(m.sender_auth_id===profile.id?'mine':'')+'">'+esc(m.message||'')+'<small>'+new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</small></div>').join('')||'<div class="empty">Start a conversation.</div>';$('msgs').scrollTop=$('msgs').scrollHeight}async function send(){const t=$('text').value.trim();if(!t||!peer)return;const senderName=profile.role==='owner'?'OWNER':(profile.display_name||'User');const r=await db.from('messages').insert({sender_id:profile.chat_id,receiver_id:peer.chat_id,sender_auth_id:profile.id,receiver_auth_id:peer.id,sender_email:profile.email,receiver_email:peer.email,sender_name:senderName,receiver_name:peer.role==='owner'?'OWNER':peer.display_name,message:t});if(r.error){notice('Message failed',r.error.message);return}$('text').value='';await loadMsgs();loadChats()}async function enableNotifications(){if(!('Notification'in window)){notice('Notifications','Browser support nahi karta.');return}const p=await Notification.requestPermission();syncNotificationButton();if(p==='granted')notice('Notifications','Enabled ✓')}function syncNotificationButton(){if(!$('notifyBtn'))return;const p=('Notification'in window)?Notification.permission:'unsupported';$('notifState').textContent=p==='granted'?'Enabled':'Not enabled';$('notifyBtn').style.display=p==='granted'?'none':'block'}function watch(){syncNotificationButton();setInterval(async()=>{if(!profile)return;const r=await db.from('messages').select('id,message,sender_name,created_at').eq('receiver_auth_id',profile.id).order('created_at',{ascending:false}).limit(1);const m=r.data?.[0];if(m&&!window.lastMsgId){window.lastMsgId=m.id}else if(m&&m.id!==window.lastMsgId){window.lastMsgId=m.id;notice('New message from '+(m.sender_name||'User'),m.message||'New message');loadChats()}},5000)}async function loadOwner(){const r=await db.from('messages').select('sender_name,receiver_name,message,created_at').order('created_at',{ascending:false}).limit(100);if(r.error)return $('ownerList').textContent=r.error.message;$('ownerList').innerHTML=(r.data||[]).map(x=>'<div class="item"><main><b>'+esc(x.sender_name||'User')+' ↔ '+esc(x.receiver_name||'User')+'</b><small>'+esc(x.message||'')+'</small></main></div>').join('')||'<div class="empty">No messages.</div>'}async function enableAuth(){}</script></body></html>
