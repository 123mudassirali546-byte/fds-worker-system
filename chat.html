<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>FDS Real-Time Chat</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--gold:#f0b52b;--gold2:#ffe28a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#19140a,#060606 42%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.header{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#fff4a8,#b87512);color:#111;font-weight:1000}.brand b{display:block}.brand small{color:#999}.badge{font-size:10px;color:var(--gold2);border:1px solid #594317;border-radius:99px;padding:6px 9px}.setup,.contacts{margin:0 15px 12px;background:linear-gradient(145deg,#151515,#090909);border:1px solid #3b2d12;border-radius:22px;padding:15px;box-shadow:0 18px 45px #000}.row{display:flex;gap:8px}.input{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:13px;padding:13px;outline:none}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:850;cursor:pointer;white-space:nowrap}.gold{background:linear-gradient(135deg,#ffe28a,#b87813);color:#090909}.dark{background:#171717;color:#fff;border:1px solid #333}.code{margin-top:10px;padding:12px;border:1px dashed #604a1d;border-radius:14px;background:#0b0b0b;display:none}.code b{font-size:25px;letter-spacing:5px;color:var(--gold2)}.status{color:#aaa;font-size:12px;min-height:18px;margin-top:9px;line-height:1.4}.contacts h3{margin:0 0 10px;font-size:14px}.contact{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #292929;border-radius:14px;background:#0b0b0b;margin-top:7px;cursor:pointer}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe28a,#9c650f);color:#111;font-weight:900}.contact-main{flex:1;min-width:0}.contact-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact-main small{color:#777}.chat{margin:0 15px 15px;border:1px solid #2c2415;border-radius:24px;overflow:hidden;background:#0a0a0a;display:flex;flex-direction:column;flex:1;min-height:58vh}.chathead{padding:14px 15px;border-bottom:1px solid #29220f;background:#101010;display:flex;justify-content:space-between}.online{font-size:10px;color:#aaa}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#555;margin-right:5px}.dot.on{background:#62d98b;box-shadow:0 0 8px #62d98b}.messages{padding:15px;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:280px;max-height:55vh}.empty{margin:auto;text-align:center;color:#666;font-size:13px;line-height:1.5}.msg{max-width:82%;padding:10px 12px;border-radius:17px;background:#171717;border:1px solid #292929;align-self:flex-start;word-break:break-word}.msg.me{align-self:flex-end;background:#30250f;border-color:#594317}.msg small{display:block;color:#777;font-size:9px;margin-top:4px;text-align:right}.composer{padding:10px;border-top:1px solid #29220f;display:flex;gap:7px;background:#101010}.composer .input{flex:1}.send{width:48px;padding:0;font-size:20px}.notice{margin:0 15px 15px;color:#777;font-size:10px;text-align:center}.room{color:var(--gold2);font-size:11px}.mini{font-size:10px;color:#777;margin-top:7px}</style></head><body><div class="app">
<header class="header"><div class="brand"><div class="logo">FDS</div><div><b>Family Dollar Shop</b><small>Real-Time Chat</small></div></div><span class="badge">LIVE • DATABASE</span></header>
<section class="setup"><div class="row"><input id="name" class="input" maxlength="30" placeholder="Apna naam likho"><button id="create" class="btn gold">Create Code</button></div><div class="row" style="margin-top:8px"><input id="room" class="input" maxlength="8" placeholder="8-digit code"><button id="join" class="btn dark">Connect</button></div><div id="code" class="code"><div style="color:#999;font-size:10px">YOUR CHAT CODE</div><b id="codeText">--------</b></div><div id="status" class="status">Supabase database chat ready.</div></section>
<section class="contacts"><h3>Search / Add Worker</h3><div class="row"><input id="search" class="input" maxlength="40" placeholder="Worker ID / chat code"><button id="add" class="btn gold">Add</button></div><div class="mini">Worker ka 8-character chat code add karo.</div><div id="contactList"></div></section>
<section class="chat"><div class="chathead"><div><b id="peerName">Not connected</b><span class="online"><span id="dot" class="dot"></span><span id="onlineText">Offline</span></span></div><span id="roomLabel" class="room"></span></div><div id="messages" class="messages"><div class="empty">Worker select karke Connect karo.</div></div><div class="composer"><input id="text" class="input" maxlength="1000" placeholder="Message..." disabled><button id="send" class="btn gold send" disabled>➤</button></div></section><div class="notice">Messages Supabase database mein save honge aur realtime sync honge.</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const SB_URL='https://hldkkxrlvprnufeoyzlf.supabase.co';const SB_KEY='sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ';const db=window.supabase.createClient(SB_URL,SB_KEY);
let me='',myName='',selected='',sub=null;
const CONTACTS='fdsChatContactsV2';
function read(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(t){$('status').textContent=t}
function renderContacts(){let a=read(CONTACTS,[]);$('contactList').innerHTML=a.map(c=>`<div class="contact" onclick="openChat('${esc(c.code)}','${esc(c.name)}')"><div class="avatar">${esc((c.name||'W')[0].toUpperCase())}</div><div class="contact-main"><b>${esc(c.name)}</b><small>${esc(c.code)}</small></div><button class="btn dark">Chat</button></div>`).join('')||'<div class="mini">No worker added.</div>'}
function addWorker(){let code=$('search').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==8)return status('8-character chat code enter karo.');let a=read(CONTACTS,[]);if(!a.some(x=>x.code===code))a.push({code,name:'Worker '+code});write(CONTACTS,a);$('search').value='';renderContacts();openChat(code,'Worker '+code)}
async function openChat(code,name){selected=code;$('peerName').textContent=name;$('roomLabel').textContent=code;$('dot').classList.add('on');$('onlineText').textContent='Live';$('text').disabled=false;$('send').disabled=false;await loadMessages();if(sub)await db.removeChannel(sub);sub=db.channel('fds-chat-'+[me,selected].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{let x=p.new;if((x.sender_id===me&&x.receiver_id===selected)||(x.sender_id===selected&&x.receiver_id===me))renderMessage(x,x.sender_id===me)}).subscribe();status('Realtime database connected.')}
async function loadMessages(){if(!me||!selected)return;$('messages').innerHTML='';let {data,error}=await db.from('messages').select('*').or(`and(sender_id.eq.${me},receiver_id.eq.${selected}),and(sender_id.eq.${selected},receiver_id.eq.${me})`).order('created_at',{ascending:true});if(error){status('Database error: '+error.message);return}if(!data?.length){$('messages').innerHTML='<div class="empty">Abhi koi message nahi.<br>Message bhejo 👋</div>';return}data.forEach(x=>renderMessage(x,x.sender_id===me))}
function renderMessage(x,isMe){let e=$('messages').querySelector('.empty');if(e)e.remove();let d=document.createElement('div');d.className='msg'+(isMe?' me':'');d.textContent=x.message;let s=document.createElement('small');s.textContent=new Date(x.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.appendChild(s);$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
async function send(){let text=$('text').value.trim();if(!text||!me||!selected)return;let {error}=await db.from('messages').insert({sender_id:me,receiver_id:selected,message:text});if(error){status('Message save nahi hua: '+error.message);return}$('text').value=''}
function setMe(){me=$('name').value.trim().toUpperCase();if(!me)return status('Worker ID/name enter karo.');myName=me;localStorage.setItem('fdsChatMe',me);status('Your ID saved: '+me)}
$('create').onclick=()=>{setMe();if(!me)return;let code=localStorage.getItem('fdsChatCode')||Math.random().toString(36).slice(2,10).toUpperCase();localStorage.setItem('fdsChatCode',code);$('code').style.display='block';$('codeText').textContent=code;$('room').value=code;status('Your permanent chat code ready.')};
$('join').onclick=()=>{setMe();let code=$('room').value.trim().toUpperCase();if(code.length!==8)return status('8-character code enter karo.');let a=read(CONTACTS,[]);if(!a.some(x=>x.code===code))a.push({code,name:'Worker '+code});write(CONTACTS,a);renderContacts();openChat(code,'Worker '+code)};
$('add').onclick=addWorker;$('send').onclick=send;$('text').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
(function init(){me=localStorage.getItem('fdsChatMe')||'';if(me)$('name').value=me;let c=localStorage.getItem('fdsChatCode');if(c){$('code').style.display='block';$('codeText').textContent=c}$('status').textContent='Supabase database ready.';renderContacts()})();
</script></body></html>
