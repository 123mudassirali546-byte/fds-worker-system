<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="cache-control" content="no-cache"><title>NEXA Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.box{width:min(420px,calc(100% - 28px));background:#111;border:1px solid #34280f;border-radius:24px;padding:24px;box-sizing:border-box}.logo{text-align:center;color:#ffe08a;font-size:34px;font-weight:900}.sub{text-align:center;color:#888;margin:5px 0 22px}.input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;margin-top:8px;font-weight:900}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff}.status{color:#ffcf66;font-size:13px;margin-top:12px;text-align:center;line-height:1.5}</style></head><body><div class="box"><div class="logo">NEXA</div><div class="sub">Private • Fast • Real-Time</div><h2>Login</h2><form id="f"><input id="e" class="input" type="email" autocomplete="username" placeholder="Email address" required><input id="p" class="input" type="password" autocomplete="current-password" placeholder="Password" required><button id="b" class="btn gold" type="submit">Login</button></form><button id="s" class="btn dark" type="button">New user? Sign up</button><div id="x" class="status"></div></div><script>(async()=>{const db=window.supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ');const $=x=>document.getElementById(x),status=t=>$('x').textContent=t;const existing=await db.auth.getSession();if(existing.data.session){location.href='chat.html?session=active';return}$('f').onsubmit=async ev=>{ev.preventDefault();$('b').disabled=true;$('b').textContent='Signing in…';status('Connecting to NEXA…');const {data,error}=await db.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});if(error){status(error.message);$('b').disabled=false;$('b').textContent='Login';return}if(!data.session){status('No login session was created.');$('b').disabled=false;$('b').textContent='Login';return}status('Login successful ✓ Opening NEXA…');setTimeout(()=>location.href='chat.html?session=active',300)};$('s').onclick=()=>location.href='signup.html';})();</script></body></html>
