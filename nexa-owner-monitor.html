<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Owner Chat Monitor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui}.app{max-width:650px;margin:auto;min-height:100vh;padding-bottom:30px}.top{padding:18px 15px;display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe28a,#a66e12);color:#111;font-weight:1000}.card{margin:0 14px 14px;padding:16px;background:#111;border:1px solid #302611;border-radius:22px}.muted{color:#888}.list{display:flex;flex-direction:column;gap:8px}.conv{padding:13px;border:1px solid #292929;background:#0b0b0b;border-radius:15px}.conv b{display:block}.conv small{display:block;color:#777;margin-top:4px}.chat{height:72vh;min-height:500px;border:1px solid #3a2b10;border-radius:22px;overflow:hidden;background:#080808;display:flex;flex-direction:column}.head{padding:12px;border-bottom:1px solid #29220f;display:flex;gap:10px;align-items:center}.head main{flex:1}.head small{display:block;color:#777}.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px}.bubble{max-width:82%;padding:10px 12px;border-radius:17px;background:#171717;border:1px solid #292929;word-break:break-word}.mine{align-self:flex-end;background:#30250f;border-color:#594317}.bubble small{display:block;text-align:right;color:#777;font-size:9px}.deleted{opacity:.75;border-style:dashed}.deleted .text{font-style:italic;color:#aaa}.empty{margin:auto;text-align:center;color:#666}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:900}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff;border:1px solid #333}.tabs{display:flex;gap:7px;margin-top:12px}.tab{flex:1}</style></head><body><div class="app"><header class="top"><div class="logo">N</div><div><b>NEXA OWNER</b><small class="muted">Private Chat Monitor • Archive</small></div></header><section id="listPage" class="card"><h2>👑 All Conversations</h2><p class="muted">Owner view: participant ke delete karne ke baad bhi archived message yahan rahega.</p><div class="tabs"><button id="allBtn" class="btn gold tab">All</button><button id="deletedBtn" class="btn dark tab">Deleted</button></div><div id="list" class="list" style="margin-top:12px"></div></section><section id="chatPage" class="chat" style="display:none;margin:0 14px"><div class="head"><button id="back" class="btn dark">←</button><main><b id="title">Conversation</b><small>OWNER MONITOR • Read only</small></main></div><div id="msgs" class="msgs"></div></section></div><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ');const $=id=>document.getElementById(id);let profile=null,current=null,mode='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const s=await db.auth.getSession();if(s.error||!s.data.session){location.href='nexa-final.html';return}const p=await db.from('profiles').select('*').eq('id',s.data.session.user.id).maybeSingle();if(p.error||!p.data||p.data.role!=='owner'){document.body.innerHTML='<div style="padding:40px;text-align:center">Owner access only.</div>';return}profile=p.data;await loadList()}async function loadList(){const r=await db.from('messages').select('*').order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const map=new Map();for(const m of r.data||[]){const k=[m.sender_auth_id,m.receiver_auth_id].sort().join('|');const deleted=!!(m.deleted_at||m.sender_deleted_at||m.receiver_deleted_at);if(mode==='deleted'&&!deleted)continue;if(!map.has(k))map.set(k,{m,deletedCount:deleted?1:0});else if(deleted)map.get(k).deletedCount++}const rows=[...map.values()];$('list').innerHTML=rows.length?rows.map((x,i)=>{const m=x.m;const del=!!(m.deleted_at||m.sender_deleted_at||m.receiver_deleted_at);return '<div class="conv" data-i="'+i+'"><b>'+esc(m.sender_name||'User')+' ↔ '+esc(m.receiver_name||'User')+'</b><small>'+esc(del?'🗑 Message deleted by participant':(m.message||'No text'))+'</small><small>'+new Date(m.created_at).toLocaleString()+(x.deletedCount?' • '+x.deletedCount+' deleted':'')+'</small></div>'}).join(''):'<div class="empty">No conversations.</div>';document.querySelectorAll('.conv').forEach((e,i)=>e.onclick=()=>open(rows[i].m))}async function open(seed){current=seed;const a=seed.sender_auth_id,b=seed.receiver_auth_id;const r=await db.from('messages').select('*').or('and(sender_auth_id.eq.'+a+',receiver_auth_id.eq.'+b+'),and(sender_auth_id.eq.'+b+',receiver_auth_id.eq.'+a+')').order('created_at',{ascending:true});if(r.error)return alert(r.error.message);$('listPage').style.display='none';$('chatPage').style.display='flex';$('title').textContent=(seed.sender_name||'User')+' ↔ '+(seed.receiver_name||'User');$('msgs').innerHTML='';for(const m of r.data||[]){const deleted=!!(m.deleted_at||m.sender_deleted_at||m.receiver_deleted_at);const d=document.createElement('div');d.className='bubble'+(deleted?' deleted':'')+(m.sender_auth_id===profile.id?' mine':'');const text=document.createElement('div');text.className='text';text.textContent=deleted?'🗑 This message was deleted by a participant':(m.message||'');d.appendChild(text);const s=document.createElement('small');s.textContent=new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+(deleted?' • archived':'' );d.appendChild(s);$('msgs').appendChild(d)}$('msgs').scrollTop=$('msgs').scrollHeight}$('back').onclick=()=>{$('chatPage').style.display='none';$('listPage').style.display='block';current=null;loadList()};$('allBtn').onclick=()=>{mode='all';$('allBtn').className='btn gold tab';$('deletedBtn').className='btn dark tab';loadList()};$('deletedBtn').onclick=()=>{mode='deleted';$('deletedBtn').className='btn gold tab';$('allBtn').className='btn dark tab';loadList()};db.channel('owner-monitor').on('postgres_changes',{event:'*',schema:'public',table:'messages'},()=>{if(current)open(current);else loadList()}).subscribe();boot();</script></body></html>
