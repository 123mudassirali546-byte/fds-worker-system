<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui;min-height:100vh}.box{width:min(620px,100%);margin:auto;min-height:100vh;box-sizing:border-box;padding:28px 14px}.login{max-width:430px;margin:10vh auto 0;background:#111;border:1px solid #34280f;border-radius:24px;padding:24px}.logo{text-align:center;color:#ffe08a;font-size:34px;font-weight:900}.sub{text-align:center;color:#888;margin:6px 0 22px}.input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;margin-top:9px;font-weight:900}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff}.status{text-align:center;color:#ffcf66;font-size:13px;line-height:1.5;min-height:22px;margin-top:12px}.app{display:none}.card{background:#111;border:1px solid #302611;border-radius:22px;padding:18px;margin-bottom:14px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{flex:1;min-width:110px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:8px;background:#0d0d0def;border-top:1px solid #29220f;display:flex;justify-content:space-around}.navb{background:none;border:0;color:#888;font-size:10px;font-weight:800}.navb.active{color:#ffe08a}.page{display:none}.page.active{display:block}.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #292929;border-radius:14px;margin-top:8px}.avatar{width:44px;height:44px;border-radius:14px;background:#ffe08a;color:#111;display:grid;place-items:center;font-weight:900}.item main{flex:1}.item small,.muted{display:block;color:#777}.id{color:#ffe08a}.row{display:flex;gap:8px}.row .input{flex:1}.chat{height:62vh;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:10px}.bubble{max-width:80%;padding:10px;border:1px solid #292929;border-radius:16px;margin:6px 0;background:#171717}.mine{margin-left:auto;background:#30250f}.composer{display:flex;gap:7px}.composer .input{flex:1}</style></head><body><div class="box"><section id="login" class="login"><div class="logo">NEXA</div><div class="sub">Private • Fast • Real-Time</div><h2>Login</h2><input id="email" class="input" type="email" placeholder="Email address"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn gold">Login</button><button id="signupBtn" class="btn dark">New user? Sign up</button><div id="status" class="status"></div></section><section id="app" class="app"><div class="card"><div class="logo" style="text-align:left;font-size:24px">NEXA</div><p id="welcome" class="muted"></p></div><main id="chats" class="page active"><div class="card"><h2>Chats</h2><div id="chatList">No chats yet.</div></div></main><main id="users" class="page"><div class="card"><h2>Users</h2><div class="row"><input id="search" class="input" maxlength="6" placeholder="NEXA ID"><button id="find" class="btn gold">Search</button></div><div id="result"></div></div></main><main id="chat" class="page"><div class="card chat"><div><button id="back" class="btn dark" style="width:auto">← Back</button><b id="chatName"> Chat</b></div><div id="msgs" class="msgs"></div><div class="composer"><input id="text" class="input" placeholder="Message..."><button id="send" class="btn gold" style="width:auto">➤</button></div></div></main><main id="profile" class="page"><div class="card"><h2 id="pname">Profile</h2><p class="muted">NEXA ID: <span id="pid" class="id"></span></p><p id="pemail" class="muted"></p><button id="logout" class="btn dark">Logout</button></div></main><main id="settings" class="page"><div class="card"><h2>Settings</h2><p>Messaging: Realtime</p><p>Privacy: Secure</p></div></main><main id="about" class="page"><div class="card"><h2>About NEXA</h2><p><b>Created by Mudassir Ali</b></p><p class="id">Full Stack Developer</p><p class="muted">Founder & Creator of NEXA Chatting System.</p></div></main><main id="owner" class="page"><div class="card"><h2>Owner Chat Monitor</h2><p class="muted">Owner access only.</p><div id="ownerList"></div></div></main></section></div><nav id="bottom" class="bottom" style="display:none"><button class="navb active" data-p="chats">💬<br>Chats</button><button class="navb" data-p="users">👥<br>Users</button><button class="navb" data-p="profile">◉<br>Profile</button><button class="navb" data-p="settings">⚙<br>Settings</button><button class="navb" data-p="about">ℹ️<br>About</button><button id="ownerNav" class="navb" data-p="owner" style="display:none">👑<br>Owner</button></nav><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ'),$=id=>document.getElementById(id);let me,profile,peer,chan;function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.navb').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='chats')loadChats()}async function loggedIn(u){me=u;const r=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(r.error||!r.data){$('status').textContent=r.error?.message||'Profile not found';return}profile=r.data;$('login').style.display='none';$('app').style.display='block';$('bottom').style.display='flex';$('welcome').textContent=(profile.role==='owner'?'Owner':'User')+' • '+(profile.email||'');$('pname').textContent=profile.role==='owner'?'OWNER':profile.display_name||'User';$('pid').textContent=profile.role==='owner'?'OWNER':profile.chat_id;$('pemail').textContent=profile.email||'';if(profile.role==='owner'){$('ownerNav').style.display='block';loadOwner()}loadChats()}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('status').textContent='Enter email and password.';$('loginBtn').disabled=true;$('status').textContent='Signing in…';const r=await db.auth.signInWithPassword({email,password});if(r.error){$('status').textContent=r.error.message;$('loginBtn').disabled=false;return}if(r.data.session){$('status').textContent='';await loggedIn(r.data.user)}else $('status').textContent='No session created.';$('loginBtn').disabled=false}async function loadChats(){const r=await db.from('messages').select('sender_auth_id,receiver_auth_id,sender_name,receiver_name,message').or(`sender_auth_id.eq.${profile.id},receiver_auth_id.eq.${profile.id}`).order('created_at',{ascending:false});if(r.error)return $('chatList').textContent=r.error.message;const m=new Map();(r.data||[]).forEach(x=>{const id=x.sender_auth_id===profile.id?x.receiver_auth_id:x.sender_auth_id;if(!m.has(id))m.set(id,x)});$('chatList').innerHTML=m.size?[...m.entries()].map(([id,x])=>`<div class="item" data-id="${id}"><div class="avatar">${(x.sender_name||x.receiver_name||'U')[0]}</div><main><b>${x.sender_auth_id===profile.id?x.receiver_name:x.sender_name}</b><small>${x.message||''}</small></main></div>`).join(''):'No chats yet.';document.querySelectorAll('#chatList .item').forEach(e=>e.onclick=async()=>{const r=await db.from('profiles').select('id,display_name,chat_id,email').eq('id',e.dataset.id).maybeSingle();if(r.data)openChat(r.data)})}async function findUser(){const id=$('search').value.trim(),r=await db.from('profiles').select('id,display_name,chat_id,email').eq('chat_id',id).maybeSingle();if(!r.data)return $('result').textContent='User not found.';peer=r.data;$('result').innerHTML=`<div class="item" id="found"><div class="avatar">${(peer.display_name||'U')[0]}</div><main><b>${peer.display_name||'User'}</b><small>NEXA ID ${peer.chat_id}</small></main></div>`;$('found').onclick=()=>openChat(peer)}async function openChat(p){peer=p;show('chat');$('chatName').textContent=' '+(p.display_name||'User');await loadMsgs();if(chan)await db.removeChannel(chan);chan=db.channel('chat-'+[profile.id,p.id].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>loadMsgs()).subscribe()}async function loadMsgs(){const r=await db.from('messages').select('*').or(`and(sender_auth_id.eq.${profile.id},receiver_auth_id.eq.${peer.id}),and(sender_auth_id.eq.${peer.id},receiver_auth_id.eq.${profile.id})`).order('created_at',{ascending:true});$('msgs').innerHTML=(r.data||[]).map(x=>`<div class="bubble ${x.sender_auth_id===profile.id?'mine':''}">${String(x.message||'').replace(/</g,'&lt;')}</div>`).join('')||'<div class="muted">Start a conversation.</div>'}async function send(){const t=$('text').value.trim();if(!t||!peer)return;const r=await db.from('messages').insert({sender_id:profile.chat_id,receiver_id:peer.chat_id,sender_auth_id:profile.id,receiver_auth_id:peer.id,sender_email:profile.email,receiver_email:peer.email,sender_name:profile.display_name,receiver_name:peer.display_name,message:t});if(r.error)return alert(r.error.message);$('text').value='';loadMsgs()}async function loadOwner(){const r=await db.from('messages').select('sender_name,receiver_name,message').order('created_at',{ascending:false});$('ownerList').innerHTML=(r.data||[]).map(x=>`<div class="item"><main><b>${x.sender_name||'User'} ↔ ${x.receiver_name||'User'}</b><small>${x.message||''}</small></main></div>`).join('')||'No chats yet.'}document.querySelectorAll('.navb').forEach(n=>n.onclick=()=>show(n.dataset.p));$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('signupBtn').onclick=()=>location.href='signup.html';$('find').onclick=findUser;$('send').onclick=send;$('back').onclick=()=>show('chats');$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(r=>{if(r.data.session)loggedIn(r.data.session.user)});</script></body></html>
