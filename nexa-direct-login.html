<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Direct Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 28px));background:#111;border:1px solid #34280f;border-radius:24px;padding:24px;box-sizing:border-box}.logo{text-align:center;color:#ffe08a;font-size:34px;font-weight:900}.sub{text-align:center;color:#888;margin:6px 0 22px}.input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;margin-top:9px;font-weight:900}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff}.status{text-align:center;color:#ffcf66;font-size:13px;line-height:1.5;min-height:22px;margin-top:12px}.app{display:none;width:min(620px,100%);min-height:100vh}.top{padding:22px 16px 14px}.card{margin:14px;padding:18px;background:#111;border:1px solid #302611;border-radius:22px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{flex:1;min-width:110px}.hidden{display:none}.ok{color:#9f9}</style></head><body><section id="loginBox" class="box"><div class="logo">NEXA</div><div class="sub">Private • Fast • Real-Time</div><h2>Login</h2><input id="email" class="input" type="email" placeholder="Email address" autocomplete="username"><input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password"><button id="login" class="btn gold">Login</button><button id="signup" class="btn dark">New user? Sign up</button><div id="status" class="status"></div></section><section id="app" class="app"><header class="top"><div class="logo">NEXA</div><div class="sub">Logged in successfully</div></header><section class="card"><h2 id="name">NEXA</h2><p>NEXA ID: <b id="nid">------</b></p><p class="ok">✓ Login active</p><div class="nav"><button id="openChat" class="btn gold">Open NEXA Chat</button><button id="logout" class="btn dark">Logout</button></div></section></section><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ'),$=id=>document.getElementById(id),setStatus=t=>$('status').textContent=t;async function enter(u){let {data:p,error}=await db.from('profiles').select('display_name,chat_id,role').eq('id',u.id).maybeSingle();if(error){setStatus('Profile error: '+error.message);return}if(!p){setStatus('Profile not found.');return}$('name').textContent=p.role==='owner'?'OWNER':(p.display_name||'User');$('nid').textContent=p.role==='owner'?'OWNER':p.chat_id;$('loginBox').style.display='none';$('app').style.display='block'}async function login(){let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return setStatus('Enter email and password.');$('login').disabled=true;$('login').textContent='Signing in…';setStatus('Connecting…');const {data,error}=await db.auth.signInWithPassword({email,password});if(error){setStatus(error.message);$('login').disabled=false;$('login').textContent='Login';return}if(!data.user||!data.session){setStatus('Login failed: no session.');$('login').disabled=false;$('login').textContent='Login';return}setStatus('Login successful ✓');await enter(data.user);$('login').disabled=false;$('login').textContent='Login'}$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('signup').onclick=()=>location.href='signup.html';$('openChat').onclick=()=>location.href='chat.html?from=direct-login';$('logout').onclick=async()=>{await db.auth.signOut();$('app').style.display='none';$('loginBox').style.display='block';setStatus('Logged out.')};db.auth.getSession().then(async({data})=>{if(data.session)await enter(data.session.user)});</script></body></html>
