ar{width:44px;height:44px;border-radius:14px;background:#ffe08a;color:#111;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.item main{flex:1}.item small,.muted{display:block;color:#777}.id{color:#ffe08a}.row{display:flex;gap:8px}.row .input{flex:1}.chat{height:62vh;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:10px}.bubble{max-width:80%;padding:10px;border:1px solid #292929;border-radius:16px;margin:6px 0;background:#171717}.mine{margin-left:auto;background:#30250f}.composer{display:flex;gap:7px}.composer .input{flex:1}.vip{border:1px solid #ffe08a;background:linear-gradient(135deg,#17120a,#30250f);box-shadow:0 0 14px #6e5319;border-radius:20px;padding:16px}.vip .goldtext{color:#ffe08a;font-weight:1000;letter-spacing:.5px}.normalProfile{border:1px solid #292929}.profilePic{width:86px;height:86px;border-radius:24px;object-fit:cover;background:#222;display:block;margin-bottom:10px}.smallbtn{width:auto;padding:10px 14px}</style></head><body><div class="box"><section id="login" class="login"><div class="logo">NEXA</div><div class="sub">Private • Fast • Real-Time</div><h2>Login</h2><input id="email" class="input" type="email" placeholder="Email address"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn gold">Login</button><button id="signupBtn" class="btn dark">New user? Sign up</button><div id="status" class="status"></div></section><section id="app" class="app"><div id="headCard" class="card"><div class="logo" style="text-align:left;font-size:24px">NEXA</div><p id="welcome" class="muted"></p></div><main id="chats" class="page active"><div class="card"><h2>Chats</h2><div id="chatList">No chats yet.</div></div></main><main id="users" class="page"><div class="card"><h2>Users</h2><div class="row"><input id="search" class="input" maxlength="6" placeholder="NEXA ID"><button id="find" class="btn gold">Search</button></div><div id="result"></div></div></main><main id="chat" class="page"><div class="card chat"><div><button id="back" class="btn dark smallbtn">← Back</button> <b id="chatName">Chat</b></div><div id="msgs" class="msgs"></div><div class="composer"><input id="text" class="input" placeholder="Message..."><button id="send" class="btn gold smallbtn">➤</button></div></div></main><main id="profile" class="page"><div id="profileCard" class="card normalProfile"><h2>Profile</h2><img id="profilePic" class="profilePic" alt="Profile picture"><input id="picInput" type="file" accept="image/*" class="input"><input id="nameInput" class="input" maxlength="40" placeholder="Your name"><button id="saveProfile" class="btn gold">Save Profile</button><p id="pname" class="muted"></p><p class="muted">NEXA ID: <span id="pid" class="id"></span></p><p id="pemail" class="muted"></p><button id="logout" class="btn dark">Logout</button></div></main><main id="settings" class="page"><div class="card"><h2>Settings</h2><p>Messaging: Realtime</p><p>Privacy: Secure</p></div></main><main id="about" class="page"><div class="card"><h2>About NEXA</h2><p><b>Created by Mudassir Ali</b></p><p class="id">Full Stack Developer</p><p class="muted">Founder & Creator of NEXA Chatting System.</p></div></main><main id="owner" class="page"><div class="card vip"><h2 class="goldtext">👑 OWNER CHAT MONITOR</h2><p class="muted">Owner access only.</p><div id="ownerList"></div></div></main></section></div><nav id="bottom" class="bottom" style="display:none"><button class="navb active" data-p="chats">💬<br>Chats</button><button class="navb" data-p="users">👥<br>Users</button><button class="navb" data-p="profile">◉<br>Profile</button><button class="navb" data-p="settings">⚙<br>Settings</button><button class="navb" data-p="about">ℹ️<br>About</button><button id="ownerNav" class="navb" data-p="owner" style="display:none">👑<br>Owner</button></nav><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ'),$=id=>document.getElementById(id);let me,profile,peer,chan;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('.navb').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='chats')loadChats()}function avatarHTML(p){return p?.avatar_url?`<div class="avatar"><img src="${safe(p.avatar_url)}"></div>`:`<div class="avatar">${safe((p?.display_name||'U')[0].toUpperCase())}</div>`}async function loggedIn(u){me=u;const r=await db.from('profiles').select('*').eq('id',u.id).maybeSingle();if(r.error||!r.data){$('status').textContent=r.error?.message||'Profile not found';return}profile=r.data;$('login').style.display='none';$('app').style.display='block';$('bottom').style.display='flex';const owner=profile.role==='owner';$('welcome').textContent=owner?'OWNER • Mudassir Ali • Full Stack Developer':'Welcome, '+(profile.display_name||'User');$('pname').textContent=owner?'OWNER • Mudassir Ali • Full Stack Developer':(profile.display_name||'User');$('pid').textContent=owner?'OWNER':profile.chat_id;$('pemail').textContent=profile.email||'';$('nameInput').value=owner?'Mudassir Ali':(profile.display_name||'');$('profilePic').src=profile.avatar_url||'';$('profileCard').className='card '+(owner?'vip':'normalProfile');if(owner){$('ownerNav').style.display='block'}loadChats();if(owner)loadOwner()}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('status').textContent='Enter email and password.';$('loginBtn').disabled=true;$('status').textContent='Signing in…';const r=await db.auth.signInWithPassword({email,password});if(r.error){$('status').textContent=r.error.message;$('loginBtn').disabled=false;return}if(r.data.session)await loggedIn(r.data.user);else $('status').textContent='No session created.';$('loginBtn').disabled=false}async function loadChats(){const r=await db.from('messages').select('sender_auth_id,receiver_auth_id,sender_name,receiver_name,message').or(`sender_auth_id.eq.${profile.id},receiver_auth_id.eq.${profile.id}`).order('created_at',{ascending:false});if(r.error)return $('chatList').textContent=r.error.message;const m=new Map();(r.data||[]).forEach(x=>{const id=x.sender_auth_id===profile.id?x.receiver_auth_id:x.sender_auth_id;if(!m.has(id))m.set(id,x)});if(!m.size)return $('chatList').textContent='No chats yet.';const ids=[...m.keys()];const pr=await db.from('profiles').select('id,display_name,avatar_url,role,chat_id').in('id',ids);const pm=new Map((pr.data||[]).map(x=>[x.id,x]));$('chatList').innerHTML=[...m.entries()].map(([id,x])=>{const p=pm.get(id),n=p?.role==='owner'?'OWNER':(p?.display_name||x.sender_name||x.receiver_name||'User');return `<div class="item" data-id="${id}">${avatarHTML(p)}<main><b>${safe(n)}</b><small>${safe(x.message||'')}</small></main></div>`}).join('');document.querySelectorAll('#chatList .item').forEach(e=>e.onclick=async()=>{const r=await db.from('profiles').select('id,display_name,chat_id,email,avatar_url,role').eq('id',e.dataset.id).maybeSingle();if(r.data)openChat(r.data)})}async function findUser(){const id=$('search').value.trim(),r=await db.from('profiles').select('id,display_name,chat_id,email,avatar_url,role').eq('chat_id',id).maybeSingle();if(!r.data)return $('result').textContent='User not found.';peer=r.data;const n=peer.role==='owner'?'OWNER':(peer.display_name||'User');$('result').innerHTML=`<div class="item" id="found">${avatarHTML(peer)}<main><b>${safe(n)}</b><small>NEXA ID ${safe(peer.chat_id)}</small></main></div>`;$('found').onclick=()=>openChat(peer)}async function openChat(p){peer=p;show('chat');$('chatName').textContent=(p.role==='owner'?'OWNER':(p.display_name||'User'));await loadMsgs();if(chan)await db.removeChannel(chan);chan=db.channel('chat-'+[profile.id,p.id].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>loadMsgs()).subscribe()}async function loadMsgs(){const r=await db.from('messages').select('*').or(`and(sender_auth_id.eq.${profile.id},receiver_auth_id.eq.${peer.id}),and(sender_auth_id.eq.${peer.id},receiver_auth_id.eq.${profile.id})`).order('created_at',{ascending:true});const ids=[profile.id,peer.id];const pr=await db.from('profiles').select('id,role,display_name').in('id',ids);const pm=new Map((pr.data||[]).map(x=>[x.id,x]));$('msgs').innerHTML=(r.data||[]).map(x=>{const sp=pm.get(x.sender_auth_id),sn=sp?.role==='owner'?'OWNER':(sp?.display_name||x.sender_name||'User');return `<div class="bubble ${x.sender_auth_id===profile.id?'mine':''}"><b>${safe(sn)}</b><br>${safe(x.message||'')}</div>`}).join('')||'<div class="muted">Start a conversation.</div>'}async function send(){const t=$('text').value.trim();if(!t||!peer)return;const senderName=profile.role==='owner'?'OWNER':(profile.display_name||'User');const r=await db.from('messages').insert({sender_id:profile.chat_id,receiver_id:peer.chat_id,sender_auth_id:profile.id,receiver_auth_id:peer.id,sender_email:profile.email,receiver_email:peer.email,sender_name:senderName,receiver_name:peer.role==='owner'?'OWNER':peer.display_name,message:t});if(r.error)return alert(r.error.message);$('text').value='';loadMsgs()}async function saveProfile(){if(profile.role==='owner')return alert('Owner profile name is fixed.');let name=$('nameInput').value.trim();if(!name)return alert('Enter your name.');let avatar=profile.avatar_url||'';const f=$('picInput').files[0];if(f){if(f.size>2*1024*1024)return alert('Profile picture must be under 2MB.');avatar=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)})}const r=await db.from('profiles').update({display_name:name,avatar_url:avatar}).eq('id',profile.id);if(r.error)return alert(r.error.message);profile.display_name=name;profile.avatar_url=avatar;$('pname').textContent=name;$('profilePic').src=avatar||'';alert('Profile updated ✓');loadChats()}async function loadOwner(){const r=await db.from('messages').select('sender_name,receiver_name,message').order('created_at',{ascending:false});$('ownerList').innerHTML=(r.data||[]).map(x=>`<div class="item"><main><b>${safe(x.sender_name||'User')} ↔ ${safe(x.receiver_name||'User')}</b><small>${safe(x.message||'')}</small></main></div>`).join('')||'No chats yet.'}document.querySelectorAll('.navb').forEach(n=>n.onclick=()=>show(n.dataset.p));$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('signupBtn').onclick=()=>location.href='signup.html';$('find').onclick=findUser;$('send').onclick=send;$('back').onclick=()=>show('chats');$('saveProfile').onclick=saveProfile;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(r=>{if(r.data.session)loggedIn(r.data.session.user)});</script></body></html>
