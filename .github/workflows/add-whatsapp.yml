name: Add NEXA WhatsApp feature
on:
  push:
    paths:
      - '.github/workflows/add-whatsapp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NEXA HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexa-final-v2.html')
          s=p.read_text(encoding='utf-8')
          original=s
          # Chat header: add a dedicated per-chat WhatsApp number button.
          if 'id="whatsappNumber"' not in s:
              old='<button id="whatsappMode" class="sm" title="Send via WhatsApp">WA</button>'
              new='<button id="whatsappNumber" class="sm" title="Set WhatsApp number">☎</button>'+old
              if old not in s: raise SystemExit('WhatsApp mode button not found')
              s=s.replace(old,new,1)
          # Ensure peer queries include whatsapp_phone.
          s=s.replace("select('id,display_name,chat_id,email,avatar_url,role')","select('id,display_name,chat_id,email,avatar_url,role,whatsapp_phone')")
          # Add a robust number setter once after the WA mode handler.
          if "window.setWhatsAppNumber" not in s:
              anchor="window.nexaSendMode='nexa';$('whatsappMode').onclick="
              start=s.find(anchor)
              if start<0: raise SystemExit('WA mode handler not found')
              # Find the end of the handler statement (the toast(...) ends with a };).
              end=s.find("};",start)
              if end<0: raise SystemExit('WA mode handler end not found')
              end+=2
              code="window.setWhatsAppNumber=async()=>{if(!peer)return;const current=peer.whatsapp_phone||'';const value=prompt('Is user ka WhatsApp number likho (country code ke sath, example 923001234567):',current);if(value===null)return;const phone=value.replace(/\\D/g,'');if(!/^\\d{10,15}$/.test(phone))return toast('Invalid number','Country code ke sath number likho, example 923001234567');const {error}=await db.from('profiles').update({whatsapp_phone:phone}).eq('id',peer.id);if(error)return toast('Save failed',error.message);peer.whatsapp_phone=phone;toast('WhatsApp number saved','Ab WA mode mein isi number par message bhej sakte ho.')};$('whatsappNumber').onclick=window.setWhatsAppNumber;"
              s=s[:end]+code+s[end:]
          p.write_text(s,encoding='utf-8')
          print('changed=',s != original)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexa-final-v2.html .github/workflows/add-whatsapp.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add per-chat WhatsApp number entry'
          git push
