name: Fix NEXA JavaScript
on:
  push:
    paths:
      - '.github/workflows/add-whatsapp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexa-final-v2.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('async window.nexaSendMode=\'nexa\';','window.nexaSendMode=\'nexa\';')
          s=s.replace('async async function send(){','async function send(){')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexa-final-v2.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix NEXA login JavaScript syntax'
          git push