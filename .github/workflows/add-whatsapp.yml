name: Add NEXA WhatsApp feature
on:
  push:
    paths:
      - '.github/workflows/add-whatsapp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NEXA HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexa-final-v2.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          old='<button id="back" class="sm">←</button><div id="chatAvatar"></div><main><b id="chatName">Chat</b><small id="chatId"></small></main><button id="audioCall" class="sm">☎</button>'
          new='<button id="back" class="sm">←</button><div id="chatAvatar"></div><main><b id="chatName">Chat</b><small id="chatId"></small></main><button id="whatsappMode" class="sm" title="Send via WhatsApp">WA</button><button id="audioCall" class="sm">☎</button>'
          if 'id="whatsappMode"' not in s:
              if old not in s: raise SystemExit('Chat header anchor not found')
              s=s.replace(old,new,1); changed=True
          if '.wa-active' not in s:
              anchor='.nav.active{color:#45b7ff}'
              if anchor not in s: raise SystemExit('CSS anchor not found')
              s=s.replace(anchor,anchor+'.wa-active{background:#183b28!important;color:#7dffae!important;border-color:#2ea85d!important}',1); changed=True
          if "window.nexaSendMode='nexa'" not in s:
              anchor="$('find').onclick=findUser;$('search').onkeydown=e=>{if(e.key==='Enter')findUser()};"
              code="window.nexaSendMode='nexa';$('whatsappMode').onclick=()=>{window.nexaSendMode=window.nexaSendMode==='whatsapp'?'nexa':'whatsapp';$('whatsappMode').classList.toggle('wa-active',window.nexaSendMode==='whatsapp');$('whatsappMode').textContent=window.nexaSendMode==='whatsapp'?'WA ✓':'WA';$('text').placeholder=window.nexaSendMode==='whatsapp'?'WhatsApp message…':'Message…';toast(window.nexaSendMode==='whatsapp'?'WhatsApp mode ON':'Nexa mode ON',window.nexaSendMode==='whatsapp'?(peer?.whatsapp_phone?'WhatsApp linked':'Is user ka WhatsApp number linked nahi hai.'):'Nexa ID par message jayega')};"
              if anchor not in s: raise SystemExit('JS anchor not found')
              s=s.replace(anchor,anchor+code,1); changed=True
          if "if(window.nexaSendMode==='whatsapp')" not in s:
              anchor="async function send(){const t=$('text').value.trim();if(!t||!peer)return;"
              code="if(window.nexaSendMode==='whatsapp'){const phone=peer.whatsapp_phone||'';if(!phone)return toast('WhatsApp unavailable','Is NEXA user ka WhatsApp number linked nahi hai.');const {data:{session}}=await db.auth.getSession();if(!session)return toast('Session expired','Dobara login karo.');$('send').disabled=true;try{const rr=await fetch('https://hldkkxrlvprnufeoyzlf.supabase.co/functions/v1/send-whatsapp',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({to:phone,message:t})});const wd=await rr.json().catch(()=>({}));if(!rr.ok)return toast('WhatsApp send failed',wd.error?.message||'Check WhatsApp setup');$('text').value='';toast('WhatsApp sent','Message WhatsApp par bhej diya gaya.')}catch(e){toast('WhatsApp send failed',e.message||'Network error')}finally{$('send').disabled=false}return}"
              if anchor not in s: raise SystemExit('send anchor not found')
              s=s.replace(anchor,anchor+code,1); changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          print('changed=',changed)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexa-final-v2.html .github/workflows/add-whatsapp.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add WhatsApp messaging control to NEXA'
          git push
