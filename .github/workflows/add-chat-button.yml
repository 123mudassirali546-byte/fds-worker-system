name: Add Chat Button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  add-chat:
    if: ${{ !contains(github.event.head_commit.message, 'Auto-add Chat button') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Chat button to existing bottom navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="chat.html"' not in s:
              s = s.replace('grid-template-columns:repeat(5,1fr)', 'grid-template-columns:repeat(6,1fr)', 1)
              button = '<a href="chat.html" class="fds-chat-link"><span>💬</span>Chat</a>'
              marker = '<nav><button data-page="scan" class="active">'
              if marker not in s:
                  raise SystemExit('Bottom navigation marker not found; existing site left unchanged.')
              s = s.replace(marker, '<nav>' + button + '<button data-page="scan" class="active">', 1)
              s = s.replace('nav button{border:0;', 'nav .fds-chat-link{border:0;background:transparent;color:#777;border-radius:15px;cursor:pointer;font-size:10px;text-decoration:none;display:grid;place-items:center}nav .fds-chat-link span{display:block;font-size:20px;line-height:24px}nav button{border:0;', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Auto-add Chat button'
          git push