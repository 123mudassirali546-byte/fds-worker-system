plugins { id 'com.android.application' }

android { namespace 'com.nexa.app'; compileSdk 35
    defaultConfig { applicationId 'com.nexa.app'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.12.1' }
