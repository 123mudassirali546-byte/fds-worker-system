<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Chatting</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,calc(100% - 28px));background:#111;border:1px solid #34280f;border-radius:24px;padding:24px;box-sizing:border-box}.logo{text-align:center;color:#ffe08a;font-size:36px;font-weight:900;margin:8px}.sub{text-align:center;color:#888;font-size:13px;margin-bottom:24px}.input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;font-weight:900;margin-top:8px}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff}.muted{color:#888;font-size:13px;line-height:1.5;text-align:center}.id{color:#ffe08a;font-weight:900}</style></head><body><div class="box"><div class="logo">NEXA</div><div class="sub">Private • Fast • Real-Time</div><section id="auth"><h2 id="title">Create NEXA Account</h2><p class="muted">Email + Password login. Google login is not used.</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password (6+ characters)"><button id="go" class="btn gold">Create Account</button><button id="toggle" class="btn dark">Already have account? Login</button><p id="status" class="muted"></p></section><section id="done" style="display:none;text-align:center"><h2>Welcome to NEXA 👋</h2><p class="muted">Your NEXA account is ready.</p><p>NEXA ID: <span id="nid" class="id"></span></p><button class="btn gold" onclick="location.href='../chat.html'">Open NEXA Chatting</button></section></div><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ'),OWNER='123mudassirali546@gmail.com';let signup=true;const $=x=>document.getElementById(x);function toggle(){signup=!signup;$('title').textContent=signup?'Create NEXA Account':'Login to NEXA';$('go').textContent=signup?'Create Account':'Login';$('toggle').textContent=signup?'Already have account? Login':'New user? Create Account';$('status').textContent=''}async function go(){let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return $('status').textContent='Valid email aur minimum 6-character password do.';let r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error)return $('status').textContent=r.error.message;if(signup&&!r.data.session)return $('status').textContent='Account ban gaya. Verification email check karo, phir Login karo.';let uid=r.data.user.id;let p=await db.from('profiles').select('chat_id').eq('id',uid).maybeSingle();if(!p.data){let cid=email.toLowerCase()===OWNER?'OWNER':String(Math.floor(100000+Math.random()*900000));let q=await db.from('profiles').insert({id:uid,email,display_name:email.split('@')[0],chat_id:cid,role:email.toLowerCase()===OWNER?'owner':'user',last_seen:new Date().toISOString()}).select('chat_id').single();if(q.error)return $('status').textContent=q.error.message;p=q}$('auth').style.display='none';$('done').style.display='block';$('nid').textContent=p.data.chat_id}$('go').onclick=go;$('toggle').onclick=toggle;</script></body></html>
