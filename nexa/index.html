<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA Chatting</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,calc(100% - 28px));background:#111;border:1px solid #34280f;border-radius:24px;padding:24px;box-sizing:border-box}.logo{text-align:center;color:#ffe08a;font-size:36px;font-weight:900;margin:8px}.sub{text-align:center;color:#888;font-size:13px;margin-bottom:24px}.input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;font-weight:900;margin-top:8px}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff}.muted{color:#888;font-size:13px;line-height:1.5;text-align:center}.id{color:#ffe08a;font-weight:900}</style></head><body><div class="box"><div class="logo">NEXA</div><div class="sub">Private • Fast • Real-Time</div><section id="auth"><h2 id="title">Login to NEXA</h2><p class="muted">Email + Password only. Google login is removed.</p><input id="email" class="input" type="email" autocomplete="email" placeholder="Email"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="go" class="btn gold">Login</button><button id="toggle" class="btn dark">New user? Create Account</button><p id="status" class="muted"></p></section><section id="done" style="display:none;text-align:center"><h2>Welcome to NEXA 👋</h2><p class="muted">Your NEXA ID</p><p class="id" id="nid"></p><button class="btn gold" onclick="location.href='../chat.html'">Open NEXA Chatting</button></section></div><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ'),OWNER='123mudassirali546@gmail.com';let signup=false;const $=x=>document.getElementById(x);function set(x){$('status').textContent=x}function toggle(){signup=!signup;$('title').textContent=signup?'Create NEXA Account':'Login to NEXA';$('go').textContent=signup?'Create Account':'Login';$('toggle').textContent=signup?'Already have account? Login':'New user? Create Account';set('')}async function ensure(user){let p=await db.from('profiles').select('chat_id').eq('id',user.id).maybeSingle();if(p.error)return p;if(p.data)return p;let cid=user.email.toLowerCase()===OWNER?'OWNER':String(Math.floor(100000+Math.random()*900000));return await db.from('profiles').insert({id:user.id,email:user.email,display_name:user.email.split('@')[0],chat_id:cid,role:user.email.toLowerCase()===OWNER?'owner':'user',last_seen:new Date().toISOString()}).select('chat_id').single()}async function go(){let email=$('email').value.trim(),password=$('password').value;if(!/^\S+@\S+\.\S+$/.test(email))return set('Valid email address likho.');if(password.length<6)return set('Password kam az kam 6 characters ka hona chahiye.');set(signup?'Creating account…':'Logging in…');let r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error){let m=r.error.message;if(m.toLowerCase().includes('rate limit'))m='Supabase email rate limit active hai. Abhi Login try karo agar account pehle ban chuka hai; new signup ke liye rate limit reset hone do.';return set(m)}if(signup&&!r.data.session)return set('Account create ho gaya. Email verify karo, phir Login karo.');let p=await ensure(r.data.user);if(p.error)return set(p.error.message);$('auth').style.display='none';$('done').style.display='block';$('nid').textContent=p.data.chat_id}db.auth.getUser().then(async r=>{if(r.data.user){let p=await ensure(r.data.user);if(!p.error){$('auth').style.display='none';$('done').style.display='block';$('nid').textContent=p.data.chat_id}}});$('go').onclick=go;$('toggle').onclick=toggle;</script></body></html>
