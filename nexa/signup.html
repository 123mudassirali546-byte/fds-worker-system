<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create NEXA Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070707;color:#fff;font-family:system-ui}.box{width:min(430px,calc(100% - 28px));padding:24px;box-sizing:border-box;background:#111;border:1px solid #34280f;border-radius:24px}.logo{text-align:center;color:#ffe08a;font-size:34px;font-weight:900}.muted{color:#888;font-size:13px}.input{width:100%;box-sizing:border-box;padding:14px;margin-top:8px;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;margin-top:10px;border:0;border-radius:13px;font-weight:900}.gold{background:#ffe08a;color:#111}.dark{background:#222;color:#fff}.status{text-align:center;margin-top:12px;color:#aaa}</style></head><body><main class="box"><div class="logo">NEXA</div><h2>Create Account</h2><p class="muted">Create your NEXA account with email and password.</p><input id="name" class="input" placeholder="Your name" maxlength="50"><input id="email" class="input" type="email" placeholder="Email address" autocomplete="email"><input id="password" class="input" type="password" placeholder="Password (6+ characters)" autocomplete="new-password"><input id="confirm" class="input" type="password" placeholder="Confirm password" autocomplete="new-password"><button id="create" class="btn gold">Create Account</button><button class="btn dark" onclick="location.href='../nexa-direct-login.html'">Already have an account? Login</button><div id="status" class="status"></div></main><script>const db=supabase.createClient('https://hldkkxrlvprnufeoyzlf.supabase.co','sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ'),$=x=>document.getElementById(x);async function create(){let name=$('name').value.trim(),email=$('email').value.trim(),p=$('password').value,c=$('confirm').value;if(!name||!email||p.length<6||p!==c)return $('status').textContent='Enter valid details and matching password.';$('create').disabled=true;$('status').textContent='Creating account…';let r=await db.auth.signUp({email,password:p,options:{data:{full_name:name}}});if(r.error){$('create').disabled=false;return $('status').textContent=r.error.message}if(!r.data.user)return $('status').textContent='Account creation failed.';let chatId=null;for(let i=0;i<10;i++){let {data:q}=await db.from('profiles').select('chat_id').eq('id',r.data.user.id).maybeSingle();if(q?.chat_id){chatId=q.chat_id;break}await new Promise(x=>setTimeout(x,150))}if(!chatId)return $('status').textContent='Account created, but profile setup is still processing. Please login in a moment.';$('status').innerHTML='Account created. Your NEXA ID is <b>'+chatId+'</b>';$('create').disabled=false;if(r.data.session)setTimeout(()=>location.href='../nexa-direct-login.html',1200);else $('status').innerHTML+=' Please login to continue.'}$('create').onclick=create;</script></body></html>
