ntent='Password kam az kam 6 characters ka hona chahiye.';if(p!==c)return $('status').textContent='Passwords match nahi kar rahe.';$('go').disabled=true;$('status').textContent='Owner account securely create ho raha hai…';let r=await db.auth.signUp({email:EMAIL,password:p});if(r.error){$('go').disabled=false;let m=r.error.message;if(m.toLowerCase().includes('already registered')||m.toLowerCase().includes('user already exists'))return $('status').textContent='Owner account pehle se maujood hai. Ab NEXA Login se login karo.';if(m.toLowerCase().includes('rate limit'))return $('status').textContent='Supabase email rate limit active hai. Is setup ke liye email confirmation ki zaroorat ho sakti hai; rate limit reset hone ke baad dobara try karo.';return $('status').textContent=m}if(!r.data.session)return $('status').textContent='Owner account create ho gaya, lekin email confirmation required hai. Supabase Auth mein email confirmation disable karne ke baad Login karo.';let uid=r.data.user.id;let q=await db.from('profiles').upsert({id:uid,email:EMAIL,display_name:'Owner',chat_id:'OWNER',role:'owner',last_seen:new Date().toISOString()},{onConflict:'id'});if(q.error)return $('status').textContent=q.error.message;$('status').textContent='Owner setup complete! OWNER account ready hai.';setTimeout(()=>location.href='./index.html',1200)};</script></body></html>
