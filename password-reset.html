<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA Password Recovery</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#070707;color:#fff;font-family:system-ui}.box{max-width:460px;margin:8vh auto;padding:20px}.card{background:#111;border:1px solid #3b2d10;border-radius:24px;padding:24px;box-shadow:0 12px 40px #000}.logo{text-align:center;color:#ffe08a;font-size:34px;font-weight:900}.muted{color:#888}.input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:13px;border:1px solid #333;background:#080808;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#ffe08a;color:#111;font-weight:900;margin-top:8px}.status{text-align:center;color:#ffe08a;min-height:24px;margin-top:12px}.hidden{display:none}a{color:#ffe08a}
</style>
</head>
<body>
<div class="box"><section class="card">
<div class="logo">NEXA</div>
<p class="muted">Secure account recovery</p>
<div id="requestBox">
<h2>Reset password</h2>
<p class="muted">Apna NEXA account email likho. Reset link email par bhej diya jayega.</p>
<input id="email" class="input" type="email" autocomplete="email" placeholder="Email address">
<button id="sendBtn" class="btn">Send reset link</button>
</div>
<div id="changeBox" class="hidden">
<h2>Set new password</h2>
<input id="newPassword" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="New password (8+ characters)">
<input id="confirmPassword" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm new password">
<button id="saveBtn" class="btn">Save new password</button>
</div>
<div id="status" class="status"></div>
<p><a href="nexa-final.html">Back to NEXA login</a></p>
</section></div>
<script>
const SUPABASE_URL='https://hldkkxrlvprnufeoyzlf.supabase.co';
const SUPABASE_KEY='sb_publishable_7DVCUy_mDYoDzhMZvt-OQg_R9xpWwWQ';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const recoveryRedirect=location.origin+location.pathname;
function status(t){$('status').textContent=t}
async function sendReset(){
 const email=$('email').value.trim();
 if(!email){status('Email enter karo.');return}
 $('sendBtn').disabled=true;status('Reset email bhej rahe hain…');
 const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:recoveryRedirect});
 $('sendBtn').disabled=false;
 status(error?'Reset request failed: '+error.message:'Reset link bhej diya. Email inbox/spam check karo.');
}
async function savePassword(){
 const p=$('newPassword').value,c=$('confirmPassword').value;
 if(p.length<8){status('Password kam az kam 8 characters ka ho.');return}
 if(p!==c){status('Dono passwords same nahi hain.');return}
 $('saveBtn').disabled=true;status('Password save ho raha hai…');
 const {error}=await db.auth.updateUser({password:p});
 if(error){$('saveBtn').disabled=false;status('Password update failed: '+error.message);return}
 status('Password successfully updated ✓ Ab NEXA login par jao.');
 setTimeout(()=>location.href='nexa-final.html',1200);
}
$('sendBtn').onclick=sendReset;$('saveBtn').onclick=savePassword;$('email').onkeydown=e=>{if(e.key==='Enter')sendReset()};
(async()=>{
 const {data:{session}}=await db.auth.getSession();
 if(session){$('requestBox').classList.add('hidden');$('changeBox').classList.remove('hidden');status('Recovery session ready. Naya password set karo.')}
 db.auth.onAuthStateChange((event,session)=>{
   if(event==='PASSWORD_RECOVERY'&&session){$('requestBox').classList.add('hidden');$('changeBox').classList.remove('hidden');status('Recovery session ready. Naya password set karo.')}
 });
})();
</script>
</body></html>
